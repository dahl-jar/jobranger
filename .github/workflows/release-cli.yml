name: Release CLI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - dotnet/cli/scripts/release/**
      - .github/actions/cli-publish/**
      - .github/workflows/release-cli.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli-${{ github.event.pull_request.number || github.ref }}
  queue: max

jobs:
  cli:
    uses: ./.github/workflows/cli.yml
    permissions:
      contents: read

  cli-python:
    uses: ./.github/workflows/cli-python.yml
    permissions:
      contents: read

  contracts:
    uses: ./.github/workflows/messages.yml
    permissions:
      contents: read

  edge:
    uses: ./.github/workflows/gateway.yml
    permissions:
      contents: read

  relay:
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read

  web:
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read

  scripts:
    name: Test release scripts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: runner.os == 'Linux'
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto '=https' -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" dotnet/cli/scripts/release/*.sh dotnet/cli/scripts/release/tests/*.sh
      - run: bash dotnet/cli/scripts/release/tests/release_test.sh

  version:
    name: Pick version
    needs: [cli, cli-python, contracts, edge, relay, web, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$(bash dotnet/cli/scripts/release/release_title.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$PR_TITLE")"
          bash dotnet/cli/scripts/release/next_version.sh "$GITHUB_SHA" "$title" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/dotnet-setup
        with:
          build: "false"

      - uses: ./.github/actions/cli-publish
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}
          output: ${{ runner.temp }}/publish

      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: tar -czf "$RUNNER_TEMP/jobranger-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP/publish" jobranger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.rid }}
          path: ${{ runner.temp }}/jobranger-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives

      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash dotnet/cli/scripts/release/assemble.sh "$VERSION" "$RUNNER_TEMP/archives" "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [version, assemble]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/jobranger-*.tar.gz

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          tag="cli-v$VERSION"
          notes_file="$RUNNER_TEMP/release-notes.md"
          bash dotnet/cli/scripts/release/release_notes.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$tag" "$PREVIOUS" >"$notes_file"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "jobranger $VERSION" --latest --notes-file "$notes_file"
