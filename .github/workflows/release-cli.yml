name: Release CLI

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check, build and assemble the release, and skip the publish job
        type: boolean
        default: false
      accepted-commits:
        description: Full SHAs of commits on main without a pull request that this release accepts, separated by spaces
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Pick version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Release CLI publishes from main only, and this run is on $REF. Start a new run on main." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dotnet/cli/scripts/release/check_main_head.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - id: next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED: ${{ inputs.accepted-commits }}
        run: |
          previous="$(bash dotnet/cli/scripts/release/latest_tag.sh)"
          bash dotnet/cli/scripts/release/release_prs.sh "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA" "$ACCEPTED" >"$RUNNER_TEMP/prs.tsv"
          bash dotnet/cli/scripts/release/check_prs.sh "$GITHUB_REPOSITORY" <"$RUNNER_TEMP/prs.tsv"
          bash dotnet/cli/scripts/release/next_version.sh "$GITHUB_SHA" "$(cut -f4 "$RUNNER_TEMP/prs.tsv")" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/dotnet-setup
        with:
          build: "false"

      - uses: ./.github/actions/cli-publish
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}
          output: ${{ runner.temp }}/publish

      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: tar -czf "$RUNNER_TEMP/jobranger-$VERSION-$RID.tar.gz" -C "$RUNNER_TEMP/publish" jobranger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.rid }}
          path: ${{ runner.temp }}/jobranger-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives

      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash dotnet/cli/scripts/release/assemble.sh "$VERSION" "$RUNNER_TEMP/archives" "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [version, assemble]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: dotnet/cli/scripts/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: dist

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dotnet/cli/scripts/release/check_main_head.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/jobranger-*.tar.gz

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          notes=(--generate-notes)
          if [ -n "$PREVIOUS" ]; then
            notes+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "cli-v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "jobranger $VERSION" --latest "${notes[@]}"
