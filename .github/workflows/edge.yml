name: Test edge worker

on:
  push:
    branches: [main]
    paths:
      - edge/**
      - .github/workflows/edge.yml
  pull_request:
    paths:
      - edge/**
      - .github/workflows/edge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, test and dry-run build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: edge/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: edge/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
