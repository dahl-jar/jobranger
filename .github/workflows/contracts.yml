name: Check contracts

on:
  push:
    branches: [main]
    paths:
      - web/scripts/**
      - scripts/codegen/**
      - scripts/unicode/**
      - contracts/**
      - cli-python/src/jobranger/contract/**
      - cli-python/tests/contract/**
      - web/src/features/relay/contract/**
      - Jobranger.slnx
      - Directory.*.props
      - global.json
      - nuget.config
      - .github/workflows/contracts.yml
      - cli-python/pyproject.toml
      - cli-python/uv.lock
      - cli-python/.python-version
      - web/package.json
      - web/pnpm-lock.yaml
      - .gitattributes
  pull_request:
    paths:
      - web/scripts/**
      - scripts/codegen/**
      - scripts/unicode/**
      - contracts/**
      - cli-python/src/jobranger/contract/**
      - cli-python/tests/contract/**
      - web/src/features/relay/contract/**
      - Jobranger.slnx
      - Directory.*.props
      - global.json
      - nuget.config
      - .github/workflows/contracts.yml
      - cli-python/pyproject.toml
      - cli-python/uv.lock
      - cli-python/.python-version
      - web/package.json
      - web/pnpm-lock.yaml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Generate, compare and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: cli-python/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - run: uv --directory cli-python sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: touch web/src/features/relay/contract/old.gen.ts
      - run: bash contracts/generate.sh
      - run: uv run --project cli-python --locked python scripts/unicode/url_parity.py
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: uv --directory cli-python run --locked pytest tests/contract
      - run: pnpm --dir web exec tsc -b
      - run: pnpm --dir web exec vitest run src/features/relay/contract tests --passWithNoTests=false
      - run: dotnet restore Jobranger.slnx --locked-mode
      - name: Check payload records cover the schema
        run: dotnet test --project contracts/tests/Jobranger.Contracts.Tests -c Release --no-restore --filter-method "*.ShouldCoverEverySchemaProperty_WhenPayloadRecordsAreChecked" --minimum-expected-tests 1
      - run: dotnet test --project contracts/tests/Jobranger.Contracts.Tests -c Release --no-restore --minimum-expected-tests 568
