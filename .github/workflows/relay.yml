name: Test backend

on:
  pull_request:
    paths:
      - messages/**
      - dotnet/messages/**
      - dotnet/relay/**
      - dotnet/Jobranger.slnx
      - dotnet/Directory.*.props
      - dotnet/global.json
      - dotnet/nuget.config
      - dotnet/.config/dotnet-tools.json
      - .editorconfig
      - .github/actions/dotnet-setup/**
      - .github/workflows/relay.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/dotnet-setup
      - run: dotnet test --project messages/tests/Jobranger.Messaging.Tests -c Release --no-build
      - run: dotnet test --project relay/tests/Jobranger.Relay.Core.Tests -c Release --no-build
      - run: dotnet test --project relay/tests/Jobranger.Relay.Tests -c Release --no-build
