name: Test backend

on:
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay.yml
  pull_request:
    paths:
      - relay/**
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: relay/global.json

      - run: dotnet restore Jobranger.Relay.slnx
      - run: dotnet format Jobranger.Relay.slnx --verify-no-changes --no-restore
      - run: dotnet build Jobranger.Relay.slnx -c Release --no-restore
      - run: dotnet test --solution Jobranger.Relay.slnx -c Release --no-build
