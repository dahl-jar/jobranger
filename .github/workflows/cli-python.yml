name: Test Python CLI

on:
  pull_request:
    paths:
      - messages/**
      - frontend/src/features/relay/contract/**
      - cli-python/**
      - .github/workflows/cli-python.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: cli-python/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
