name: Test Python CLI

on:
  push:
    branches: [main]
    paths:
      - contracts/**
      - "!contracts/src/**"
      - "!contracts/tests/**"
      - "!contracts/stryker-config.json"
      - web/src/features/relay/contract/**
      - cli-python/**
      - .github/workflows/cli-python.yml
  pull_request:
    paths:
      - contracts/**
      - "!contracts/src/**"
      - "!contracts/tests/**"
      - "!contracts/stryker-config.json"
      - web/src/features/relay/contract/**
      - cli-python/**
      - .github/workflows/cli-python.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: cli-python/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
