[project]
name = "jobranger-golden"
version = "0.0.0"
description = "Offline export of the Python CLI goldens for the C# CLI tests"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "T20", "RET", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"export_goldens.py" = ["S603", "S607"]
