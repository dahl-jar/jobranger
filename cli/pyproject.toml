[project]
name = "jobranger"
version = "0.1.0"
description = "Fetches Norwegian job ads and matches them against a candidate profile"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12,<2",
    "cryptography>=44",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "keyring>=25.7,<26",
    "openai>=3.26,<4",
    "packaging>=24",
    "platformdirs>=4.12,<5",
    "pydantic>=2.14,<3",
    "pypdf[crypto]>=6",
    "ruamel.yaml>=0.19.1,<0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml",
    "mutmut",
    "jsonschema[format-nongpl]==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobranger"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "T20", "PT", "RET", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105"]
"scripts/*" = ["S603", "T20"]
"src/jobranger/storage/store.py" = ["S608"]
"src/jobranger/storage/migrations.py" = ["S608"]
"src/jobranger/matching/classify.py" = ["PLR0913", "PLR0917"]
"src/jobranger/pipeline.py" = ["PLR0913", "N818"]
"src/jobranger/providers/prices.py" = ["PLR0913"]
"src/jobranger/providers/openai_compat.py" = ["PLR0913", "PLR0917"]
"src/jobranger/sources/base.py" = ["N818"]
"src/jobranger/child_process.py" = ["S603"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests", "scripts"]
empty_parameter_set_mark = "fail_at_collect"

[tool.mutmut]
source_paths = ["src/jobranger/"]
also_copy = ["tests/", "scripts/"]
