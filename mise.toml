[settings]
idiomatic_version_file_enable_tools = ["dotnet"]

[tools]
node = "24"
pnpm = "12.10.1"
uv = "0.10.12"

[tasks."dotnet:build"]
description = "Restore and build the .NET solution"
run = [
  "dotnet restore Jobranger.slnx --locked-mode",
  "dotnet build Jobranger.slnx -c Release --no-restore -warnaserror",
]

[tasks."web:install"]
description = "Install the web dependencies from the lockfile"
run = "pnpm --dir web install --frozen-lockfile"

[tasks."edge:install"]
description = "Install the edge worker dependencies from the lockfile"
run = "pnpm --dir edge install --frozen-lockfile"

[tasks.build]
description = "Build the .NET solution and the web app"
depends = ["dotnet:build", "web:install"]
run = "pnpm --dir web build"

[tasks."test:dotnet"]
description = "Format check and test the .NET solution"
depends = ["dotnet:build"]
run = [
  "dotnet format Jobranger.slnx --verify-no-changes --no-restore",
  "dotnet test --solution Jobranger.slnx -c Release --no-build",
]

[tasks."test:python"]
description = "Lint, type check and test the Python CLI"
dir = "{{config_root}}/cli-python"
run = [
  "uv sync --locked",
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run mypy",
  "uv run pytest",
]

[tasks."test:web"]
description = "Test the web app"
depends = ["web:install"]
run = "pnpm --dir web test"

[tasks."test:edge"]
description = "Test the edge worker"
depends = ["edge:install"]
run = "pnpm --dir edge test"

[tasks."test:release"]
description = "Test the release scripts"
run = "bash scripts/release/tests/release_test.sh"

[tasks.test]
description = "Run every suite"
depends = ["test:dotnet", "test:python", "test:web", "test:edge", "test:release"]

[tasks."contracts:check"]
description = "Regenerate contract code and fail on drift or untracked files"
depends = ["web:install"]
run = [
  "uv --directory cli-python sync --locked",
  "bash contracts/generate.sh",
  "uv run --project cli-python --locked python scripts/unicode/url_parity.py",
  "git diff --exit-code",
  "test -z \"$(git status --porcelain)\" || { git status --porcelain; exit 1; }",
]
