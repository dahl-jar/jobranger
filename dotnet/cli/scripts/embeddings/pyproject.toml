[project]
name = "jobranger-embeddings-golden"
version = "0.0.0"
description = "Offline export of the embedder golden file for the C# CLI tests"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "sentence-transformers==6.1.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.20.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "T20", "RET", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"export_golden.py" = ["S310"]
